syntax = "proto3";

package common.v1;

option go_package = "github.com/example/poly-contracts/gen/go/common/v1;commonv1";


/// Metadata associated with a request or operation.
message Metadata {
  /// Unique identifier for the request.
  string request_id = 1;

  /// Timestamp when the request was created.
  int64 created_at = 2;
}


/// Monetary amount with currency and value.
message Money {
  /// Currency code (e.g., USD, EUR).
  string currency = 1;

  /// Amount of money.
  string amount = 2;
}
