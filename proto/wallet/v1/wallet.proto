syntax = "proto3";

package wallet.v1;

import "common/v1/common.proto";

option go_package = "github.com/example/poly-contracts/gen/go/wallet/v1;walletv1";


message WalletBalanceChanged {

  string wallet_id = 1;

  string asset = 2;

  common.v1.Money balance = 3;

  common.v1.Metadata metadata = 4;
}